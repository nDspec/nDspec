# .github/workflows/docs-build-check.yml
name: Docs build check

on:
  pull_request:
    branches:
      - '**'
    paths: #only run the test when the following paths are changed
      - 'docs/**'
      - 'ndspec/**'
      - 'pyproject.toml'
      - '.readthedocs.yaml'
      - '.github/workflows/docs-build-check.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  docs-build:
    name: Build Sphinx docs 
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install package with docs extras
        run: pip install -e ".[docs]"

      - name: Build documentation
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          sphinx-build -b html -n --keep-going docs docs/_build/html 2>&1 | tee sphinx-output.log

      # Check the exit status of sphinx, depending on whether it failed, or 
      # raised warnings/errors/critical issue. 
      - name: Classify build result
        id: classify
        if: always()
        shell: bash
        #first check if the build failed completely without even producing output, 
        #then check the content of the output and classify the result 
        run: |
          if [ ! -f sphinx-output.log ]; then
            echo "status=failure"   >> "$GITHUB_OUTPUT"
            echo "warn_count=0"     >> "$GITHUB_OUTPUT"
            echo "err_count=0"      >> "$GITHUB_OUTPUT"
            exit 0
          fi

          warn_count=$(grep -cE "WARNING:" sphinx-output.log || true)
          err_count=$(grep -cE "ERROR:|CRITICAL:" sphinx-output.log || true)

          if [ "${{ steps.build.outcome }}" != "success" ] || [ "$err_count" -gt 0 ]; then
            status=failure
          elif [ "$warn_count" -gt 0 ]; then
            status=warnings
          else
            status=clean
          fi

          echo "status=$status"          >> "$GITHUB_OUTPUT"
          echo "warn_count=$warn_count"  >> "$GITHUB_OUTPUT"
          echo "err_count=$err_count"    >> "$GITHUB_OUTPUT"

      # produce a summary of the warnings/error/critical that are produced 
      - name: Surface warnings and errors as annotations
        if: always() && steps.classify.outputs.status != 'clean'
        shell: bash
        run: |
          grep -E "WARNING:|ERROR:|CRITICAL:" sphinx-output.log | while IFS= read -r line; do
            rel="${line#"$GITHUB_WORKSPACE"/}"

            level=warning
            case "$rel" in *"ERROR:"*|*"CRITICAL:"*) level=error ;; esac

            if [[ "$rel" =~ ^([^:]+):([0-9]+):[[:space:]]*(WARNING|ERROR|CRITICAL):[[:space:]]*(.*)$ ]]; then
              file="${BASH_REMATCH[1]}"; lineno="${BASH_REMATCH[2]}"; msg="${BASH_REMATCH[4]}"
            elif [[ "$rel" =~ ^([^:]+):.*(WARNING|ERROR|CRITICAL):[[:space:]]*(.*)$ ]]; then
              file="${BASH_REMATCH[1]}"; lineno=1; msg="${BASH_REMATCH[3]}"
            else
              file=""; lineno=""; msg="${rel#*: }"
            fi

            msg="${msg//%/%25}"

            if [ -n "$file" ]; then
              echo "::${level} file=${file},line=${lineno}::${msg}"
            else
              echo "::${level}::${msg}"
            fi
          done

      #summarize the output of the attempt to build the docs 
      - name: Write job summary
        if: always()
        shell: bash
        run: |
          status="${{ steps.classify.outputs.status }}"
          warns="${{ steps.classify.outputs.warn_count }}"
          errs="${{ steps.classify.outputs.err_count }}"

          {
            echo "## Docs build check"
            case "$status" in
              clean)
                echo "**Documentation built cleanly.** No Sphinx warnings, errors, or critical issues."
                ;;
              warnings)
                echo " **Documentation built, but with ${warns} warning(s).**"
                echo ""
                echo "HTML output was produced, so ReadTheDocs will still publish this branch."
                echo "The warnings below are usually nitpicky stuff."
                ;;
              failure)
                echo " **Documentation failed to build** (${errs} error/critical issue(s), ${warns} warning(s))."
                echo ""
                echo "ReadTheDocs is likely to fail on this commit. "
                echo "Fix before merging."
                ;;
            esac

            if [ "$status" != "clean" ]; then
              echo ""
              echo "<details><summary>Sphinx output (last 100 lines)</summary>"
              echo ""
              echo '```'
              tail -n 100 sphinx-output.log
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

     #write in a PR comment whether the docs are building or not 
      - name: Upsert PR comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          STATUS: ${{ steps.classify.outputs.status }}
          WARN_COUNT: ${{ steps.classify.outputs.warn_count }}
          ERR_COUNT: ${{ steps.classify.outputs.err_count }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- docs-build-check -->';
            const { STATUS, WARN_COUNT, ERR_COUNT } = process.env;

            let body;
            if (STATUS === 'clean') {
              body = `${marker}\n **Docs build check:** documentation built cleanly on the latest commit`;
            } else {
              let log = '';
              try { log = fs.readFileSync('sphinx-output.log', 'utf8'); } catch (e) {}
              const issues = log.split('\n').filter(l => /WARNING:|ERROR:|CRITICAL:/.test(l));
              const preview = issues.slice(0, 30).join('\n');
              const more = issues.length > 30 ? `\n...and ${issues.length - 30} more.` : '';

              const header = STATUS === 'warnings'
                ? `**Docs build check:** the docs **built successfully**, but Sphinx emitted **${WARN_COUNT} warning(s)**.\n\nReadTheDocs will still publish this branch. Most of these should be nitpicky stuff, but double check and fix if possible.`
                : `**Docs build check:** the documentation **failed to build** (${ERR_COUNT} error/critical issue(s), ${WARN_COUNT} warning(s)).\n\nThe ReadTheDocs build for this branch is likely to fail. Fix before merging.`;

              body = `${marker}\n${header}\n\n<details><summary>Sphinx output (first 30 issues)</summary>\n\n\`\`\`\n${preview}${more}\n\`\`\`\n</details>`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
