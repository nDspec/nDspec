version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - pandoc          # REQUIRED by nbsphinx
  jobs:
    post_checkout:
      - git fetch --unshallow || true    # setuptools_scm needs full history

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
